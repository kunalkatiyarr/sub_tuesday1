<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1st Page for Git Commit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <tbody>
        <tr>
          <td>S.no</td>
          <td>1<sup>st</sup> Input</td>
        </tr>
      </tbody>
    </table>

    <p>
      First Value: <span id="first"></span><br />
      Second Value: <span id="second"></span><br />
      <span id="output"></span>
    </p>

    <script>
      const a = Number.parseInt(prompt("Enter the value of a", "0"), 10) || 0;
      const b = Number.parseInt(prompt("Enter the value of b", "0"), 10) || 0;

      document.getElementById("first").textContent = a;
      document.getElementById("second").textContent = b;
      document.getElementById("output").textContent = "Sum: " + (a + b);
    </script>
  </body>
</html>
